[package]
name = "compas_forge"
version = "0.4.0"
edition = "2021"
publish = true
description = "Rust geometry and robotic-fabrication preflight kernels for COMPAS"
license = "MIT"
repository = "https://github.com/moaminmo/compas-forge"
homepage = "https://github.com/moaminmo/compas-forge"
readme = "README.md"
keywords = ["compas", "robotics", "geometry", "collision-detection", "pyo3"]
categories = ["algorithms", "science", "api-bindings"]

[lib]
name = "compas_forge_core"
crate-type = ["cdylib", "rlib"]

[features]
bench-support = []

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
earcutr = "0.5"
rstar = "0.13"
parry3d-f64 = "0.31"
simd-json = { version = "0.18", features = ["serde_impl"] }

[build-dependencies]
cc = "1.1"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "native_ccd"
harness = false
required-features = ["bench-support"]
