[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "compas-forge"
version = "0.4.0"
description = "High-performance pre-flight validation and geometry QA engine for COMPAS framework"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mohammad Amin Moradi" }
]
keywords = ["compas", "robotics", "geometry", "collision-detection", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "compas>=2,<3",
    "click>=8.1.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
fab = ["compas_fab>=2.0.1,<3"]
benchmark = ["pyperf>=2.10,<3", "matplotlib>=3.8,<4"]
test = ["hypothesis>=6.100,<7", "pytest>=8,<10", "trimesh>=4,<6"]

[project.scripts]
compas-forge = "compas_forge.cli:main"

[project.urls]
Homepage = "https://github.com/moaminmo/compas-forge"
Repository = "https://github.com/moaminmo/compas-forge"
Issues = "https://github.com/moaminmo/compas-forge/issues"

[project.entry-points."compas.plugins"]
compas_forge = "compas_forge.plugin"

[tool.maturin]
python-source = "python"
module-name = "compas_forge._core"
