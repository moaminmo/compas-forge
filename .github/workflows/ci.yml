name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  independent-clearance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[fab,test]" pybullet==3.2.7
      - run: python -m pytest tests/test_clearance.py tests/test_pybullet_differential.py tests/test_convex_reference.py tests/test_adversarial_clearance.py tests/test_solid_bounds.py tests/test_release_hardening.py tests/test_scene_paths.py -q

  independent-cgal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[fab,test]" compas-cgal==0.10.0
      - run: python -m pytest tests/test_cgal_differential.py -q

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Rhino 8 embeds CPython 3.9; Rhino 9 uses the CPython 3.13 ABI.
        python: ['3.9', '3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install ".[fab,test]"
      - run: python -m pytest tests -q
