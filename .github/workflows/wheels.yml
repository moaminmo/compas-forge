name: Build distribution artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        # Keep explicit wheels for Rhino 8 (cp39) and Rhino 9 (cp313).
        python: ["3.9", "3.11", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: windows-latest
            target: x64
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
          manylinux: auto
          sccache: true
      - name: Install wheel and current integration dependencies
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps --no-index --find-links dist compas-forge
          python -m pip install --disable-pip-version-check "compas_fab==2.0.1" "pytest>=8,<10" "hypothesis>=6.100,<7" "trimesh>=4,<6" "click>=8.1" "rich>=13.7"
      - name: Smoke-test installed artifact
        run: python -m pytest tests -q
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Install source artifact as a consumer
        shell: bash
        run: |
          python -m pip install "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)[fab]"
          python -m pip check
          python examples/consumer_install_check.py --job-output consumer-job.json
          compas-forge trajectory consumer-job.json --clearance .001 --articulated-tolerance .001 --serial
      - uses: actions/upload-artifact@v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
